[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roxchaos"
version = "0.1.0"
description = "External Docker chaos harness for the Roxia workflow stack"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
roxchaos = "roxchaos.cli:main"

[tool.setuptools.packages.find]
include = ["roxchaos*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --junitxml=reports/junit.xml"
testpaths = ["tests"]
